<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitação de Ausência</title>
   <link rel="stylesheet" href="../CSS/reset.css">
    <link rel="stylesheet" href="../CSS/style2.css">
</head>

<body>

    
<header class="topo">
 
    <a href="../menu.html" class="menu-link">
        <img src="../img/icons8-cardápio-50.png" alt="Menu">
    </a>
 
    <h1 class="titulo-topo">Roster</h1>
 
    <section class="acoes-topo">
 
        <a href="../perfil.html" class="icone-topo">
            <img src="../img/icons8-usuário-homem-com-círculo-24.png" alt="Perfil">
        </a>
 
        <a href="#" class="icone-topo">
            <img src="../img/bell_ring.png" alt="Notificações">
        </a>
 
    </section>
 
</header>
 
<main class="conteudo">

    <a href="../index.html" class="confirmacao-voltar">
        <img src="../img/icons8-à-esquerda-dentro-de-um-círculo-24.png" alt="Voltar">
    </a>
    
    <h2 class="titulo-pagina">Solicitação de Ausência</h2>
 
    <section class="card-viagem">
 
        <section class="card-topo">
            <span class="data-wrapper">
                <p class="data">04/03/2026</p>
                <span class="icone-editar">✏️</span>
            </span>
            <p class="base">Base: GRU</p>
        </section>
 
        <section class="rota">
 
            <article class="trajeto">
                <span class="barra-vermelha"></span>
                <span class="trajeto-info">
                    <span class="trajeto-horario">8:45 <span class="seta-play">▶</span> 10:30</span>
                    <span class="trajeto-rota">GRU → GIG</span>
                </span>
            </article>
 
            <article class="trajeto">
                <span class="barra-vermelha"></span>
                <span class="trajeto-info">
                    <span class="trajeto-horario">8:45 <span class="seta-play">▶</span> 10:30</span>
                    <span class="trajeto-rota">GRU → SSA</span>
                </span>
            </article>
 
        </section>
 
        <p class="jornada">Jornada designada</p>
 
    </section>
 
    <form action="confirmar_lm.html" method="get" class="formulario">
 
        <label class="label-form">Motivo</label>
 
        <select name="motivo" class="campo-select">
            <option selected disabled>Selecione...</option>
            <option>Emergência Familiar</option>
            <option>Doença (Licença Médica)</option>
            <option>Problemas Pessoais</option>
            <option>Consulta Médica</option>
            <option>Outros</option>
        </select>
 
        <fieldset class="textarea-wrapper">
            <textarea
                name="observacao"
                class="campo-textarea"
                placeholder="Informe os detalhes..."
            ></textarea>
            <span class="textarea-mais">⊕</span>
        </fieldset>
 
        <button type="submit" class="botao-enviar">
            ENVIAR
        </button>
 
    </form>
 
</main>
 
</body>
</html>
